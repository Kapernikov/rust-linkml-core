[package]
name = "linkml_tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "linkml-validate"
path = "src/bin/linkml_validate.rs"

[[bin]]
name = "linkml-convert"
path = "src/bin/linkml_convert.rs"

[[bin]]
name = "linkml-diff"
path = "src/bin/linkml_diff.rs"

[[bin]]
name = "linkml-patch"
path = "src/bin/linkml_patch.rs"

[[bin]]
name = "linkml-schema-validate"
path = "src/bin/linkml_schema_validate.rs"

[dependencies]
linkml_runtime = { path = "../runtime", default-features = false }
linkml_schemaview = { path = "../schemaview", package = "schemaview" }
linkml_meta = { path = "../metamodel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
yaml_serde = "0.10"
serde_path_to_error = "0.1.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
tempfile = "3"
oxrdf = "0.3"
oxttl = "0.2"

[features]
default = ["resolve", "ttl", "curies", "full_regex"]
resolve = ["linkml_schemaview/resolve", "linkml_runtime/resolve"]
ttl = ["linkml_runtime/ttl"]
disk_graph = ["ttl", "linkml_runtime/disk_graph"]
curies = ["linkml_runtime/curies", "linkml_schemaview/curies"]
full_regex = ["linkml_runtime/full_regex"]
slim = ["linkml_runtime/slim"]
