id: https://example.com/geo-test
name: geo_test
prefixes:
  geotest: https://example.com/geo-test/
  geosparql: http://www.opengis.net/ont/geosparql#
  linkml: https://w3id.org/linkml/
default_prefix: geotest
imports:
- linkml:types
types:
  wktLiteral:
    uri: geosparql:wktLiteral
    typeof: string
    title: Well-known Text Literal
    description: A Well-known Text serialization of a Geometry object.
  # Derived types carrying no `uri` of their own: everything they contribute to
  # serialisation is inherited through `typeof`.
  weblink:
    typeof: uri
    base: URI
    repr: str
  trackLength:
    typeof: integer
    base: int
classes:
  Place:
    attributes:
      name:
        range: string
      location:
        range: wktLiteral
      homepage:
        range: uri
      related_doc:
        range: uriorcurie
      mirror:
        range: weblink
      track_length:
        range: trackLength
