[package]
name = "linkml-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "linkml_core_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.3"
runtime = { package = "linkml_runtime", path = "../runtime", features = ["python"] }
